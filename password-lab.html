<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratorio de Contraseñas</title>

<style>
body {
    background: #080b10;
    color: #e5e7eb;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #111827;
    padding: 25px;
    border-radius: 15px;
}

h1 {
    color: #4ade80;
}

input, button {
    padding: 12px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #475569;
}

button {
    background: #16a34a;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.console {
    background: #020617;
    color: #4ade80;
    padding: 15px;
    margin-top: 20px;
    min-height: 150px;
    font-family: monospace;
    white-space: pre-line;
}
</style>
</head>

<body>

<div class="container">

<h1>🔐 Laboratorio de contraseñas</h1>

<p>
Este laboratorio utiliza una contraseña ficticia. 
No se conecta a Facebook ni a ningún servicio externo.
</p>

<h3>Contraseña de laboratorio</h3>

<input id="password" type="password"
placeholder="Escribe una contraseña de prueba">

<br>

<button onclick="probar()">Iniciar prueba</button>

<div class="console" id="resultado">
&gt; Sistema preparado...
</div>

</div>

<script>

const lista = [
"123456",
"password",
"admin",
"admin123",
"12345678",
"Casa123",
"Casa1234",
"qwerty",
"123123",
"colombia",
"Deimer123",
"prueba123"
];

function probar() {

    const objetivo = document.getElementById("password").value;
    const resultado = document.getElementById("resultado");

    if (!objetivo) {
        resultado.textContent = "> Escribe una contraseña de laboratorio.";
        return;
    }

    resultado.textContent =
        "> Iniciando laboratorio...\n" +
        "> Lista de pruebas: " + lista.length + " palabras\n\n";

    let i = 0;

    const intervalo = setInterval(() => {

        if (i >= lista.length) {

            clearInterval(intervalo);

            resultado.textContent +=
                "\n> No se encontró la contraseña en la lista.\n" +
                "> Esto demuestra por qué una contraseña fuera de las listas comunes es más difícil de adivinar.";

            return;
        }

        resultado.textContent +=
            "> Intento " + (i + 1) + ": " + lista[i] + "\n";

        if (lista[i] === objetivo) {

            clearInterval(intervalo);

            resultado.textContent +=
                "\n✅ ¡Contraseña de laboratorio encontrada!\n" +
                "> Intentos realizados: " + (i + 1);

            return;
        }

        i++;

    }, 300);
}

</script>

</body>
</html>
